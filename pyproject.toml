[project]
name = "frx"
version = "0.1.0"
description = "Offline CTF forensics CLI: an orchestrator around existing analysis tools"
requires-python = ">=3.11"
dependencies = [
    "rich>=13",
    "python-magic>=0.4",
]

[project.scripts]
frx = "frx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
